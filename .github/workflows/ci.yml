name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l cmd internal)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: lint
        # Built from source with the go.mod toolchain; .golangci.yml holds the
        # complexity limit of 10.
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
      - name: test
        run: go test ./...
      - name: build
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /tmp/s3drive ./cmd/s3drive
